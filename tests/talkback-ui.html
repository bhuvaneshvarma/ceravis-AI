<!doctype html>
<meta charset="utf-8">
<title>Talk-back UI checks</title>
<!--
  The listen toggle broke twice, both times in a way no Python test could see:
  once because a toggle's "off" path was written as a guard clause, and once
  because the button remembered a state the audio path could contradict. Both
  are behaviour in a DOM, so they are checked in a DOM.

  Run: open this file in any browser (no server, no runner, no node), or serve
  the repo and open it. It drives the REAL talk-panel.js against a model of what
  live-view.js does with a track, and asserts what a carer would see.

  It deliberately does NOT touch a microphone, a camera or a network.
-->
<style>
  body { font: 14px/1.6 ui-monospace, Menlo, Consolas, monospace; padding: 24px;
         background: #0f1520; color: #dbe4ee; }
  h1 { font-size: 15px; letter-spacing: .08em; text-transform: uppercase;
       color: #8391a6; }
  .pass::before { content: "PASS  "; color: #46b17b; }
  .fail::before { content: "FAIL  "; color: #e2574c; }
  .fail { color: #e2574c; }
  #summary { margin-top: 18px; padding-top: 12px; border-top: 1px solid #23304a;
             font-weight: 700; }
</style>
<h1>Talk-back UI checks</h1>
<div id="out">running…</div>
<div id="summary"></div>

<script src="../edge/static/ceravis.js"></script>
<script src="../edge/static/talk.js"></script>
<script src="../edge/static/talk-panel.js"></script>
<script>
(async function () {
  const results = [];
  const ok = (name, cond) => results.push({ name, cond: !!cond });

  // --- stubs: the page's dependencies, and nothing else --------------------
  // A talk button opens the page's standby session the moment it exists, so the
  // browser APIs it uses are replaced BEFORE any tile is built.
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const sockets = [];
  const workletPosts = [];
  const worklets = [];
  navigator.mediaDevices.getUserMedia = async () => ({ getTracks: () => [{ stop() {} }] });
  window.AudioContext = class {
    constructor() { this.state = "running"; this.audioWorklet = { addModule: async () => {} };
                    this.destination = {}; }
    createMediaStreamSource() { return { connect() {}, disconnect() {} }; }
    createGain() { return { gain: { value: 1 }, connect(x) { return x; } }; }
    resume() { return Promise.resolve(); } close() {}
  };
  window.AudioWorkletNode = class {
    constructor() { this.port = { postMessage: m => workletPosts.push(m), onmessage: null };
                    worklets.push(this); }
    connect(x) { return x; } disconnect() {}
  };
  /* The page's talk session, played by the test: welcome, grant, refuse, push. */
  window.WebSocket = class {
    constructor(u) { this.url = u; this.readyState = 0; this.sent = []; this.bufferedAmount = 0;
                     sockets.push(this); }
    send(d) { this.sent.push(d); }
    close() { this.readyState = 3; }
    push(m) { this.onmessage && this.onmessage({ data: JSON.stringify(m) }); }
    welcome(cameras) { this.readyState = 1; this.push({ type: "welcome", mic_gain: 1,
                                                       cameras: cameras || {} }); }
    drop(code, reason) { this.readyState = 3; this.onclose && this.onclose({ code, reason }); }
    claims() { return this.sent.filter(d => typeof d === "string" && JSON.parse(d).type === "claim")
                               .map(d => JSON.parse(d).camera); }
    texts(type) { return this.sent.filter(d => typeof d === "string" && JSON.parse(d).type === type); }
    audio() { return this.sent.filter(d => d instanceof ArrayBuffer).length; }
  };
  const live = () => sockets[sockets.length - 1];
  const frameIn = () => {
    const h = worklets.length && worklets[worklets.length - 1].port.onmessage;
    if (typeof h === "function")
      h({ data: { type: "audio", frame: new ArrayBuffer(160), peak: 0.2 } });
  };
  window.cvEdgeId = () => Promise.resolve("TEST-EDGE");
  const realFetch = window.fetch;
  window.fetch = (u, o) => {
    if (String(u).includes("/talkback/cameras"))
      return Promise.resolve(new Response(JSON.stringify({
        enabled: true,
        cameras: [{ camera_id: "cam_1", camera_name: "LOUNGE", configured: true },
                  { camera_id: "cam_2", camera_name: "BEDROOM", configured: true },
                  { camera_id: "cam_3", camera_name: "KITCHEN", configured: true,
                    readiness: { state: "rejected", message: "refused" } },
                  { camera_id: "cam_4", camera_name: "HALL", configured: true,
                    readiness: { state: "unsupported" } },
                  { camera_id: "cam_5", camera_name: "PORCH", configured: false },
                  { camera_id: "cam_6", camera_name: "STUDY", configured: true,
                    readiness: { state: "ready" } }],
      }), { headers: { "Content-Type": "application/json" } }));
    return realFetch(u, o);
  };

  /* A faithful model of what live-view.js does: listening is a property of the
     TRACK plus the element's mute flag, and a reconnect hands over a brand-new
     track that arrives enabled. */
  function makeStream() {
    let muted = true, want = false, tracks = [{ enabled: false }];
    return {
      listen(on) {
        want = !!on;
        tracks.forEach(t => { t.enabled = want; });
        muted = !want;
        return tracks.length > 0;
      },
      listening() {
        return !muted && tracks.length > 0 && tracks[0].enabled;
      },
      reconnect() {                       // a NEW track, which arrives enabled
        tracks = [{ enabled: true }];
        tracks.forEach(t => { t.enabled = want; });
        muted = !want;
      },
    };
  }

  await cvTalkPanel.ensure();

  const tile = document.createElement("div");
  document.body.appendChild(tile);
  const s1 = makeStream();
  cvTalkPanel.mount(tile, { camera_id: "cam_1", camera_name: "LOUNGE" }, s1);
  const btn = () => tile.querySelector(".listen-btn");
  const label = () => btn().querySelector(".talk-label").textContent;

  ok("mounts off", btn().dataset.listen === "off" && !s1.listening());

  btn().click();
  ok("one click starts listening", s1.listening() && label() === "Listening");

  btn().click();
  ok("a second click STOPS it (the toggle was one-way twice)",
     !s1.listening() && btn().dataset.listen === "off" && label() === "Listen");

  btn().click(); btn().click(); btn().click();
  ok("an odd number of clicks leaves it on", s1.listening());
  btn().click();
  ok("an even number leaves it off", !s1.listening());

  // Rebuilding a control over a room that is still audible: the desync that
  // made the button start a click out of phase with the room.
  btn().click();
  ok("audible before the rebuild", s1.listening());
  cvTalkPanel.remount(tile, { camera_id: "cam_1", camera_name: "LOUNGE" }, s1);
  ok("commissioning does not silence the room", s1.listening());
  ok("the rebuilt button adopts reality", btn().dataset.listen === "on");
  btn().click();
  ok("ONE click switches it off after a rebuild", !s1.listening());

  // A reconnect must never overrule the carer's last decision, either way.
  s1.reconnect();
  ok("a reconnect does not un-mute a room switched off", !s1.listening());
  btn().click(); s1.reconnect();
  ok("a reconnect keeps a room switched on", s1.listening());

  // One room at a time.
  const tile2 = document.createElement("div");
  document.body.appendChild(tile2);
  const s2 = makeStream();
  cvTalkPanel.mount(tile2, { camera_id: "cam_2", camera_name: "BEDROOM" }, s2);
  tile2.querySelector(".listen-btn").click();
  ok("turning one room on turns the other off", s2.listening() && !s1.listening());

  // The talk button shows what the device already KNOWS, before any press.
  function talkFor(cid, name) {
    const t = document.createElement("div");
    document.body.appendChild(t);
    cvTalkPanel.mount(t, { camera_id: cid, camera_name: name }, makeStream());
    return t.querySelector(".talk-btn");
  }
  const refused = talkFor("cam_3", "KITCHEN");
  ok("a camera that refused the password shows a SETUP button, not a mic",
     refused && refused.dataset.talk === "setup" &&
     /refused/.test(refused.textContent));
  ok("a camera with no talk-back at all shows no dead control",
     talkFor("cam_4", "HALL") === null);
  const unset = talkFor("cam_5", "PORCH");
  ok("a camera with no password yet asks for it",
     unset && unset.dataset.talk === "setup" && /Set up talk/.test(unset.textContent));
  const ready = talkFor("cam_6", "STUDY");
  ok("a ready camera gets the real hold-to-talk button",
     ready && ready.dataset.talk === "idle" && /Hold to talk/.test(ready.textContent));
  ok("the setup dialog is reachable from camera setup",
     typeof cvTalkPanel.commission === "function");

  // --- the page's ONE standby session ---------------------------------------
  await sleep(30);
  const ws = live();
  ok("a page opens ONE talk session for all its talk buttons, when it loads",
     sockets.length === 1 && /\/talkback\/session\?/.test(ws.url));
  ok("it identifies the page, so a reconnect gets its own floor back",
     /client_id=pg-/.test(ws.url) && /edge_id=TEST-EDGE/.test(ws.url));
  ws.welcome({ cam_6: { readiness: { state: "ready" }, floor: { state: "free" } } });

  function channel(cid) {
    const b = document.createElement("button");
    document.body.appendChild(b);
    const seen = { states: [], refused: 0, floors: [] };
    const h = cvTalk.attach(b, cid, {
      onState: (st, d) => seen.states.push(d ? st + ":" + d : st),
      onRefused: () => seen.refused++,
      onFloor: (st, by, mine) => seen.floors.push([st, by, mine]),
    });
    const press = () => b.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, pointerId: 1 }));
    const up = () => b.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, pointerId: 1 }));
    return { h, b, seen, press, up, last: () => seen.states[seen.states.length - 1] };
  }

  const lounge = channel("LOUNGE"), living = channel("LIVING_ROOM");
  ok("more talk buttons share the same session", sockets.length === 1);

  lounge.press(); await sleep(20);
  ok("a press sends a claim for its camera on the open session — nothing to connect",
     ws.claims().slice(-1)[0] === "LOUNGE");
  ws.push({ type: "granted", camera: "LOUNGE" }); await sleep(10);
  ok("granted -> On air", lounge.last() === "live");
  frameIn(); frameIn();
  ok("speech flows as binary frames while the button is held", ws.audio() === 2);
  for (let i = 0; i < 20; i++) frameIn();
  ok("and keeps flowing for as long as it is held (no time limit)", ws.audio() === 22);
  lounge.up(); await sleep(10);
  ok("letting go sends release, and the button is idle",
     ws.texts("release").length === 1 && lounge.last() === "idle");
  frameIn();
  ok("and no speech is sent after it", ws.audio() === 22);

  ws.push({ type: "floor", camera: "LOUNGE", state: "speaking", by: "Nurse Arun",
            client_id: "someone-else" }); await sleep(10);
  ok("another carer speaking is shown on the button BEFORE anyone presses",
     lounge.last() === "busy" && lounge.seen.floors.slice(-1)[0][1] === "Nurse Arun");
  lounge.press(); await sleep(10);
  ws.push({ type: "refused", camera: "LOUNGE", code: "busy",
            message: "Nurse Arun is speaking to LOUNGE." }); await sleep(10);
  ok("pressing anyway is refused with the device's sentence — and not retried",
     lounge.last() === "error:Nurse Arun is speaking to LOUNGE." && sockets.length === 1);
  ws.push({ type: "floor", camera: "LOUNGE", state: "free" }); await sleep(10);
  ok("when the room is free again, every page shows it", lounge.last() === "idle");

  // One microphone per page.
  lounge.press(); await sleep(10);
  ws.push({ type: "granted", camera: "LOUNGE" }); await sleep(10);
  living.press(); await sleep(10);
  ok("pressing a second camera takes the microphone from the first",
     lounge.last() === "idle" && ws.claims().slice(-1)[0] === "LIVING_ROOM");
  ws.push({ type: "granted", camera: "LIVING_ROOM" }); await sleep(10);
  const before = ws.audio(); frameIn();
  ok("and speech now goes out for the second camera", living.last() === "live"
     && ws.audio() === before + 1);
  living.up(); await sleep(10);

  // A carer who moves to another camera before the first answer arrives.
  lounge.press(); await sleep(10);
  lounge.up(); await sleep(10);
  living.press(); await sleep(10);
  const releasesBefore = ws.texts("release").length;
  ws.push({ type: "granted", camera: "LOUNGE" }); await sleep(10);
  ok("a late grant for a camera the carer already left sends nothing (it would cut off the new room)",
     ws.texts("release").length === releasesBefore && lounge.last() === "idle");
  ws.push({ type: "granted", camera: "LIVING_ROOM" }); await sleep(10);
  const beforeLate = ws.audio(); frameIn();
  ok("…and the room they are holding now is live", living.last() === "live"
     && ws.audio() === beforeLate + 1);
  living.up(); await sleep(10);

  // The session drops while a carer is still holding the button.
  living.press(); await sleep(10);
  ws.push({ type: "granted", camera: "LIVING_ROOM" }); await sleep(10);
  ws.drop(1006, "");
  ok("a dropped connection mid-sentence says Reconnecting…", living.last() === "reconnecting");
  for (let i = 0; i < 9; i++) frameIn();
  await sleep(700);
  const ws2 = live();
  ok("the page reconnects by itself, as the same page", ws2 !== ws &&
     new URL(ws2.url.replace("ws:", "http:")).searchParams.get("client_id") ===
     new URL(ws.url.replace("ws:", "http:")).searchParams.get("client_id"));
  ws2.welcome({}); await sleep(10);
  ok("…re-claims the floor for the carer still holding the button",
     ws2.claims().slice(-1)[0] === "LIVING_ROOM");
  ws2.push({ type: "granted", camera: "LIVING_ROOM" }); await sleep(10);
  ok("…and sends only the newest 100 ms it held on to (oldest dropped)",
     ws2.audio() === 5 && living.last() === "live");
  living.up(); await sleep(10);

  // The edge ends a turn itself.
  lounge.press(); await sleep(10);
  ws2.push({ type: "granted", camera: "LOUNGE" }); await sleep(10);
  ws2.push({ type: "taken", camera: "LOUNGE", by: "Dr Rao" }); await sleep(10);
  ok("a floor taken by a higher priority (future doctor role) says who took it",
     lounge.last() === "error:Taken over by Dr Rao.");
  lounge.press(); await sleep(10);
  ws2.push({ type: "refused", camera: "LOUNGE", code: "unauthorized",
             message: "The camera refused the TP-Link password." }); await sleep(10);
  ok("a refused password asks the page to redraw the tile as a setup button",
     lounge.seen.refused === 1);

  // FULL DUPLEX: the room stays audible while the carer talks.
  const tileD = document.createElement("div");
  document.body.appendChild(tileD);
  const sD = makeStream();
  cvTalkPanel.mount(tileD, { camera_id: "cam_6", camera_name: "STUDY" }, sD);
  tileD.querySelector(".listen-btn").click();
  const talkD = tileD.querySelector(".talk-btn");
  talkD.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, pointerId: 2 }));
  await sleep(10);
  ws2.push({ type: "granted", camera: "cam_6" }); await sleep(10);
  ok("listening stays ON while talking — a resident's reply is heard",
     sD.listening() && tileD.querySelector(".listen-btn").dataset.listen === "on"
     && talkD.dataset.talk === "live");
  talkD.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, pointerId: 2 }));

  // A device that says "do not come back".
  ws2.drop(4503, "disabled: Talk-back is switched off on this device.");
  await sleep(700);
  ok("a device with talk-back switched off is final: said once, not retried",
     living.last() === "error:Talk-back is switched off on this device." && live() === ws2);

  // --- report -------------------------------------------------------------
  const out = document.getElementById("out");
  out.innerHTML = "";
  results.forEach(r => {
    const d = document.createElement("div");
    d.className = r.cond ? "pass" : "fail";
    d.textContent = r.name;
    out.appendChild(d);
  });
  const failed = results.filter(r => !r.cond).length;
  const sum = document.getElementById("summary");
  sum.textContent = failed
    ? failed + " of " + results.length + " CHECKS FAILED"
    : "All " + results.length + " talk-back UI checks passed.";
  sum.style.color = failed ? "#e2574c" : "#46b17b";
})();
</script>
