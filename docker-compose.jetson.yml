# CERAVIS — Jetson production stack.
# Build & run ON the Jetson:
#   docker compose -f docker-compose.jetson.yml up -d --build
services:

  edge:
    build:
      context: ./edge
      dockerfile: Dockerfile.jetson
    container_name: ceravis-edge
    runtime: nvidia       # exposes the iGPU to TensorRT/PyCUDA
    network_mode: host    # easier for RTSP discovery on the LAN
    env_file:
      - ./infra/env/jetson.env
    volumes:
      - ./edge:/app
      - ./models:/models
      - ./edge/data:/app/data
      # If your cameras are CSI / Argus:
      # - /tmp/argus_socket:/tmp/argus_socket
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app
    depends_on:
      - redis
      - nats

  redis:
    image: redis:7-alpine
    container_name: ceravis-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  nats:
    image: nats:2-alpine
    container_name: ceravis-nats
    restart: unless-stopped

volumes:
  redis_data:
