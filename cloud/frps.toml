# CERAVIS live-stream tunnel — frp SERVER (runs on the AWS EC2 box).
#
# frp (fast reverse proxy) lets each Jetson, which sits behind a home router with
# no public address, expose its MediaMTX WebRTC SIGNALING port through this one
# public server. Only the signaling (a few KB per view) crosses this box — the
# video itself goes peer-to-peer home <-> viewer (UDP, STUN-assisted), so EC2
# data transfer stays near-zero.
#
# Fleet model (one domain, one port, many houses):
#   Caddy (TLS, :443) ──► frps HTTP vhost (:7080) ──► the right frpc tunnel
#   picked by the URL path prefix /<edge_id>  ──► that home's MediaMTX :8889
# Every edge dials in with type="http" + locations=["/<edge_id>"]; frps routes
# by that first path segment. Adding a house needs NOTHING here — only a new
# edge with its own edge_id. See cloud/README.md.
#
# EDIT auth.token below to a long random secret, and put the SAME value in every
# edge's frpc.toml. Nothing else needs changing.

bindPort = 7000                     # edges (frpc) connect here — open TCP 7000

# HTTP vhost port for all type="http" proxies (the live-stream tunnels). Caddy
# terminates TLS on :443 and reverse-proxies to 127.0.0.1:7080, so this port is
# PLAIN HTTP and must stay CLOSED to the internet in the security group — only
# Caddy, on the same box, reaches it over loopback.
vhostHTTPPort = 7080

# Only an edge that knows this token may open a tunnel. Change it.
auth.method = "token"
auth.token = "CHANGE_ME_TO_A_LONG_RANDOM_SECRET"

# Keep the admin dashboard off (nothing to expose). Logs to journald via systemd.
log.to = "console"
log.level = "info"
