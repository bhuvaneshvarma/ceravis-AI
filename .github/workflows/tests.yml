# Runs the whole test suite (tests/run_all.py) on every push and pull request.
# These are the pure-Python parts — no Jetson, TensorRT or cameras needed;
# on-device behaviour is checked by setup/check_jetson.sh on the device itself.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-22.04          # the Ubuntu release JetPack 6 is built on
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0           # test_installer builds a release bundle with git
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # the device's Python
      - name: Install the app's Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r edge/requirements.txt opencv-python-headless "scipy<1.14"
      - name: Run every test
        run: python tests/run_all.py
