<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" role="img" aria-label="AI and IoT connected healthcare monitoring">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f6f5"/>
      <stop offset="1" stop-color="#f8fbfd"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3aa2a6"/>
      <stop offset="1" stop-color="#2c7f83"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a33"/>
      <stop offset="1" stop-color="#ff6600"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="680" height="470" rx="30" fill="url(#bg)"/>
  <circle cx="612" cy="66" r="130" fill="#ff6600" opacity="0.07"/>
  <circle cx="70" cy="430" r="150" fill="#35989d" opacity="0.08"/>

  <!-- connective data flow -->
  <g fill="none" stroke="#35989d" stroke-width="2.4" stroke-linecap="round" opacity="0.55" stroke-dasharray="2 9">
    <path d="M182 214 C 250 150, 300 150, 336 132"/>
    <path d="M392 138 C 452 168, 470 210, 500 232"/>
    <path d="M360 168 C 372 250, 300 300, 250 316"/>
    <path d="M386 118 C 470 92, 512 92, 560 96"/>
  </g>

  <!-- ================= HOME / CARE RECIPIENT ================= -->
  <g>
    <path d="M74 214 L162 150 L250 214 Z" fill="url(#teal)"/>
    <rect x="92" y="212" width="140" height="150" rx="14" fill="#ffffff" stroke="#dfeaf0" stroke-width="2"/>
    <rect x="92" y="212" width="140" height="150" rx="14" fill="url(#teal)" opacity="0.06"/>
    <!-- person -->
    <circle cx="150" cy="262" r="18" fill="#0f172a"/>
    <path d="M116 344 C 116 300, 184 300, 184 344 Z" fill="#0f172a"/>
    <!-- caring heart -->
    <path d="M150 226 c -9 -11 -26 -3 -26 10 c 0 11 15 19 26 27 c 11 -8 26 -16 26 -27 c 0 -13 -17 -21 -26 -10 z" fill="url(#orange)"/>
    <!-- floor -->
    <rect x="80" y="360" width="164" height="7" rx="3.5" fill="#cfe0e3"/>
  </g>

  <!-- IoT camera watching -->
  <g>
    <path d="M150 262 L120 176 L184 176 Z" fill="#35989d" opacity="0.12"/>
    <rect x="104" y="158" width="52" height="26" rx="7" fill="#0f172a"/>
    <path d="M156 165 l18 -8 v24 l-18 -8 z" fill="#0f172a"/>
    <circle cx="120" cy="171" r="6" fill="#35989d"/>
    <circle cx="120" cy="171" r="2.4" fill="#ff6600"/>
    <g fill="none" stroke="#35989d" stroke-width="2.2" stroke-linecap="round" opacity="0.8">
      <path d="M92 150 a 16 16 0 0 1 0 -22"/>
      <path d="M84 156 a 26 26 0 0 1 0 -34"/>
    </g>
  </g>

  <!-- ================= AI CORE ================= -->
  <g filter="url(#glow)">
    <circle cx="340" cy="122" r="47" fill="url(#teal)"/>
  </g>
  <circle cx="340" cy="122" r="47" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <g stroke="#ffffff" stroke-width="2" fill="#ffffff" opacity="0.95">
    <line x1="340" y1="122" x2="318" y2="102"/>
    <line x1="340" y1="122" x2="364" y2="104"/>
    <line x1="340" y1="122" x2="320" y2="146"/>
    <line x1="340" y1="122" x2="362" y2="146"/>
    <circle cx="318" cy="102" r="5"/>
    <circle cx="364" cy="104" r="5"/>
    <circle cx="320" cy="146" r="5"/>
    <circle cx="362" cy="146" r="5"/>
    <circle cx="340" cy="122" r="7" fill="#ff6600" stroke="none"/>
  </g>
  <text x="340" y="197" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#2c7f83" letter-spacing="1">AI ENGINE</text>

  <!-- secure cloud -->
  <g>
    <path d="M534 96 a 20 20 0 0 1 39 -6 a 16 16 0 0 1 3 32 h -44 a 15 15 0 0 1 2 -26 z" fill="#ffffff" stroke="#dfeaf0" stroke-width="2"/>
    <path d="M556 84 l7 4 v6 c 0 5 -4 8 -7 9 c -3 -1 -7 -4 -7 -9 v-6 z" fill="url(#teal)"/>
  </g>

  <!-- ================= HEALTH DASHBOARD ================= -->
  <g filter="url(#soft)">
    <rect x="430" y="196" width="196" height="150" rx="18" fill="#ffffff"/>
  </g>
  <rect x="430" y="196" width="196" height="150" rx="18" fill="none" stroke="#e6eef2" stroke-width="1.5"/>
  <rect x="430" y="196" width="196" height="40" rx="18" fill="url(#teal)" opacity="0.10"/>
  <circle cx="452" cy="216" r="6" fill="#ff6600"/>
  <text x="466" y="221" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#0f172a">Live vitals</text>
  <path d="M596 210 h16 M604 202 v16" stroke="#35989d" stroke-width="2.4" stroke-linecap="round"/>

  <!-- ECG line -->
  <path d="M446 288 h30 l10 -26 l14 46 l12 -34 l10 14 h60"
        fill="none" stroke="url(#orange)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- heart + check -->
  <path d="M470 320 c -7 -9 -21 -3 -21 8 c 0 9 12 15 21 22 c 9 -7 21 -13 21 -22 c 0 -11 -14 -17 -21 -8 z" fill="url(#teal)"/>
  <circle cx="560" cy="322" r="17" fill="#eafaf1" stroke="#34d399" stroke-width="2"/>
  <path d="M552 322 l6 6 l11 -13" fill="none" stroke="#22a06b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="506" y="316" width="30" height="8" rx="4" fill="#e4edf2"/>
  <rect x="506" y="330" width="20" height="8" rx="4" fill="#e4edf2"/>

  <!-- IoT nodes along the network -->
  <g fill="#ff6600">
    <circle cx="262" cy="150" r="4"/>
    <circle cx="300" cy="284" r="4"/>
    <circle cx="452" cy="192" r="4"/>
    <circle cx="470" cy="96" r="4"/>
  </g>

  <!-- baseline pulse -->
  <path d="M40 432 h150 l14 -20 l18 40 l16 -30 l12 12 h360"
        fill="none" stroke="#35989d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
</svg>
