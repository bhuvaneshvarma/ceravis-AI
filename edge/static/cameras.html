<!doctype html>
<html lang="en">
<head>
<script src="fleet-prefix.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CERAVIS — Cameras</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="ceravis.css" />
</head>
<body>
<div class="page">
  <div class="page-head">
    <h1>Cameras</h1>
    <div class="sub">Discover and add cameras, control them, verify their live feeds,
      and sync them to your CERAVIS account — the same tools as the setup wizard.</div>
  </div>
  <div id="cam-root"></div>
  <div class="row" style="justify-content:flex-end; margin-top:16px">
    <button class="btn btn-primary" id="cam-save-btn">Save</button>
  </div>
</div>

<script src="ceravis.js"></script>
<script src="live-view.js"></script>
<script src="cameras-panel.js"></script>
<script>
cvRequireAuth();
renderNav("cameras.html");
const camPanel = mountCameras(document.getElementById("cam-root"));
document.getElementById("cam-save-btn").onclick = () => camPanel.syncCameras();
</script>
</body>
</html>
