<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CERAVIS — AI Monitor</title>
<link rel="stylesheet" href="ceravis.css" />
<style>
  .mon { display: grid; grid-template-columns: 1fr 360px; gap: 16px; align-items: start; }
  @media (max-width: 1100px) { .mon { grid-template-columns: 1fr; } }
  .mon-stage { position: relative; background: #000; border-radius: 12px;
               overflow: hidden; border: 1px solid var(--line); }
  .mon-stage canvas { width: 100%; display: block; }
  .track-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .track-chip { display: flex; align-items: center; gap: 8px;
                padding: 7px 12px; border-radius: 10px; font-size: 12.5px;
                background: var(--panel-2); border: 1px solid var(--line); }
  .track-chip .sq { width: 10px; height: 10px; border-radius: 3px; }
  .track-chip b { text-transform: uppercase; letter-spacing: .5px; }
  .track-chip.fallen { border-color: rgba(248,113,113,.5);
                       background: rgba(248,113,113,.1); animation: blink 1.2s infinite; }
  .sidecol .card { margin-bottom: 14px; }
  #live-log { max-height: 420px; }
  #event-log { max-height: 300px; }
</style>
</head>
<body>
<div class="page">
  <div class="page-head">
    <h1>AI monitor</h1>
    <div class="sub">Live detection, tracking and posture recognition — boxes are drawn
      from the edge pipeline in real time; every recognized movement is logged on the right.</div>
  </div>

  <div class="row mb" style="align-items:center; gap:10px">
    <span class="pill pill-mute" id="m-mode">SEARCHING</span>
    <span id="m-active" class="faint"></span>
    <span id="m-state" class="faint"></span>
  </div>

  <div class="mon">
    <div>
      <div class="mon-stage"><canvas id="m-canvas" width="1280" height="720"></canvas></div>
      <div class="track-chips" id="m-chips"></div>
    </div>

    <div class="sidecol">
      <div class="card">
        <h2>Live activity log</h2>
        <div class="log" id="live-log">
          <div class="faint" id="log-empty">Waiting for movement…</div>
        </div>
      </div>
      <div class="card">
        <h2>Event history <span class="faint">(rule engine)</span></h2>
        <div class="log" id="event-log"></div>
      </div>
    </div>
  </div>
</div>

<script src="ceravis.js"></script>
<script>
renderNav("monitor.html");

const POSTURE_COLOR = {
  standing: "#34d399", sitting: "#60a5fa", walking: "#2dd4bf",
  fallen: "#f87171", unknown: "#8fa3bf",
};

const M = {
  cam: null, stream: null, lastImg: null,
  state: {},                 // latest ai/state for ALL cameras
  lastPosture: {},           // track_id -> posture (for transition log)
  searching: true,           // true when no enrolled target is in view
};
const canvas = document.getElementById("m-canvas");
const ctx = canvas.getContext("2d");
let CAM_NAMES = {};          // camera_id -> "Name (Room)"

async function initCamNames() {
  const cams = await api("/api/v1/cameras").catch(() => []);
  CAM_NAMES = Object.fromEntries(
    cams.map(c => [c.camera_id, `${c.camera_name} (${c.room_name})`]));
}

/* ---- target-driven camera selection -----------------------------
   The monitor follows the enrolled recipient: it shows whichever camera the
   ReID-matched target is on, and only that person's box. With no target in
   view it falls back to the busiest camera in a "searching" state. Camera
   choice is sticky to avoid flapping when several cameras see people. */
function camsWithTarget(state) {
  return Object.keys(state).filter(
    cam => (state[cam].tracks || []).some(t => t.is_target));
}
// Reality check: there is only ONE enrolled recipient, so only ONE target is
// ever shown — the highest ReID-score match among any is_target tracks.
function bestTarget(camState) {
  const ts = ((camState && camState.tracks) || []).filter(t => t.is_target);
  if (!ts.length) return null;
  const sc = t => (t.reid_score != null ? t.reid_score : (t.confidence || 0));
  return ts.reduce((a, b) => (sc(b) > sc(a) ? b : a));
}
function pickCamera(state) {
  const cams = Object.keys(state);
  if (!cams.length) return { cam: null, searching: true };
  const withTarget = camsWithTarget(state);
  if (M.cam && withTarget.includes(M.cam))      // target still here -> stay
    return { cam: M.cam, searching: false };
  if (withTarget.length)                        // target moved -> follow it
    return { cam: withTarget[0], searching: false };
  // No target anywhere: keep the current camera if it still exists, else the
  // most-active one (max raw detections). Either way we are "searching".
  if (M.cam && state[M.cam]) return { cam: M.cam, searching: true };
  let best = cams[0], bestN = -1;
  cams.forEach(c => { const n = state[c].detections || 0;
    if (n > bestN) { bestN = n; best = c; } });
  return { cam: best, searching: true };
}
function setCamera(camId, searching) {
  M.searching = searching;
  if (camId === M.cam) return;                   // no change — keep the stream
  if (M.stream) { M.stream.stop(); M.stream = null; }
  M.cam = camId; M.lastPosture = {}; M.lastImg = null;
  if (!camId) return;
  const img = new Image();
  M.stream = liveStream(img, camId, {
    onFrame: () => { M.lastImg = img; draw(); },
    onState: s => document.getElementById("m-state").textContent =
      s === "live" ? "" : `stream: ${s}`,
  });
}

/* ---- render loop -------------------------------------------------- */
function draw() {
  const img = M.lastImg;
  if (!img) return;
  if (canvas.width !== img.naturalWidth) {
    canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
  }
  ctx.drawImage(img, 0, 0);
  if (M.searching) { drawSearching(); return; }
  // Only the single best-matching target is drawn — other people are ignored.
  const best = bestTarget(M.state[M.cam]);
  const tracks = best ? [best] : [];
  const lw = Math.max(2, canvas.width / 480);
  ctx.font = `600 ${Math.max(14, canvas.width / 70)}px sans-serif`;
  tracks.forEach(t => {
    const [x1, y1, x2, y2] = t.bbox;
    const color = POSTURE_COLOR[t.posture || "unknown"] || POSTURE_COLOR.unknown;
    ctx.lineWidth = lw; ctx.strokeStyle = color;
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    const who = t.is_target && t.recipient_id ? t.recipient_id
              : t.recipient_id ? t.recipient_id : `person #${t.track_id}`;
    const label = `${who}${t.posture ? " · " + t.posture.toUpperCase() : ""}`;
    const tw = ctx.measureText(label).width;
    const lh = Math.max(20, canvas.width / 50);
    ctx.fillStyle = "rgba(0,0,0,.78)";
    ctx.fillRect(x1, Math.max(0, y1 - lh), tw + 14, lh);
    ctx.fillStyle = color;
    ctx.fillText(label, x1 + 7, Math.max(lh - 6, y1 - 6));
    if (t.posture === "fallen") {           // red emphasis frame
      ctx.save(); ctx.strokeStyle = "rgba(248,113,113,.55)";
      ctx.lineWidth = lw * 3; ctx.strokeRect(x1 - 6, y1 - 6, x2 - x1 + 12, y2 - y1 + 12);
      ctx.restore();
    }
  });
}
function drawSearching() {
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,.32)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = "center";
  ctx.fillStyle = "#fbbf24";
  ctx.font = `600 ${Math.max(20, canvas.width / 42)}px sans-serif`;
  ctx.fillText("🔍 Searching for target…", canvas.width / 2, canvas.height / 2);
  ctx.fillStyle = "rgba(255,255,255,.72)";
  ctx.font = `500 ${Math.max(13, canvas.width / 80)}px sans-serif`;
  ctx.fillText("No enrolled recipient in view",
    canvas.width / 2, canvas.height / 2 + Math.max(26, canvas.width / 28));
  ctx.textAlign = "start";
  ctx.restore();
}

/* ---- AI state polling + movement log ------------------------------ */
function logEntry(html, cls = "") {
  const empty = document.getElementById("log-empty");
  if (empty) empty.remove();
  const box = document.getElementById("live-log");
  const e = el("div", `log-entry ${cls}`,
    `<span class="t">${fmtTime()}</span><span class="what">${html}</span>`);
  box.prepend(e);
  while (box.children.length > 80) box.lastChild.remove();
}
async function pollState() {
  let state;
  try { state = await api(`/api/v1/ai/state`); } catch { return; }   // ALL cameras
  M.state = state;
  const pick = pickCamera(state);
  setCamera(pick.cam, pick.searching);
  updateHeader();

  // Exactly one target (highest ReID score); everyone else is ignored.
  const best = M.searching ? null : bestTarget(M.state[M.cam]);
  const tracks = best ? [best] : [];

  // chips
  document.getElementById("m-chips").innerHTML = tracks.length === 0
    ? `<span class="faint" style="font-size:12.5px">${M.searching
        ? "Searching for the enrolled recipient…" : "Target not in view."}</span>`
    : tracks.map(t => {
        const c = POSTURE_COLOR[t.posture || "unknown"];
        const who = t.recipient_id || "target";
        return `<span class="track-chip ${t.posture === "fallen" ? "fallen" : ""}">
          <span class="sq" style="background:${c}"></span>
          ${who} — <b style="color:${c}">${t.posture || "detecting…"}</b>
          ${t.posture_confidence ? `<span class="faint">${Math.round(t.posture_confidence*100)}%</span>` : ""}
          ${t.view_label ? `<span class="faint">· ${t.view_label}</span>` : ""}
        </span>`;
      }).join("");

  // transition log (target only)
  const seen = new Set();
  tracks.forEach(t => {
    seen.add(t.track_id);
    const prev = M.lastPosture[t.track_id];
    if (t.posture && t.posture !== prev) {
      const who = t.recipient_id || "target";
      if (t.posture === "fallen")
        logEntry(`⚠ ${who} — <b>FALL DETECTED</b>`, "fall");
      else
        logEntry(`${who}: ${prev ? prev + " → " : ""}<b>${t.posture}</b>`);
      M.lastPosture[t.track_id] = t.posture;
    }
  });
  Object.keys(M.lastPosture).forEach(id => {
    if (!seen.has(Number(id))) delete M.lastPosture[id];
  });
  draw();
}

function updateHeader() {
  const modeEl = document.getElementById("m-mode");
  const activeEl = document.getElementById("m-active");
  const camName = CAM_NAMES[M.cam] || M.cam || "—";
  if (M.searching) {
    modeEl.className = "pill pill-warn"; modeEl.textContent = "SEARCHING";
    activeEl.textContent = M.cam
      ? `Scanning ${camName} — no enrolled target in view`
      : "No cameras available";
  } else {
    const t = bestTarget(M.state[M.cam]);
    const who = (t && t.recipient_id) || "target";
    modeEl.className = "pill pill-ok"; modeEl.textContent = "TARGET LOCKED";
    activeEl.textContent = `${who} · ${camName}`;
  }
}

/* ---- persisted events (rule engine) -------------------------------- */
async function pollEvents() {
  try {
    const evts = await api(`/api/v1/events?limit=25${M.cam ? "&camera_id=" + M.cam : ""}`);
    document.getElementById("event-log").innerHTML = evts.length === 0
      ? `<div class="faint" style="font-size:12.5px">No events recorded yet.</div>`
      : evts.map(e => `
        <div class="log-entry ${e.event_type === "fall" ? "fall" : ""}">
          <span class="t">${new Date(e.timestamp).toLocaleTimeString([], {hour12:false})}</span>
          <span class="what"><b>${e.event_type}</b>
            <span class="faint">· ${e.room_name || e.camera_id}${e.recipient_id ? " · " + e.recipient_id : ""}</span>
          </span>
        </div>`).join("");
  } catch {}
}

initCamNames();
setInterval(pollState, 400);
setInterval(pollEvents, 5000);
pollEvents();
</script>
</body>
</html>
