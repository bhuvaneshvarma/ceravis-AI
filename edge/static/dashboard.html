<!doctype html>
<html lang="en">
<head>
<script src="fleet-prefix.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CERAVIS — Edge Metrics</title>
<link rel="stylesheet" href="ceravis.css" />
<style>
  .metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .big { font-size: 30px; font-weight: 800; color: var(--navy); letter-spacing: -.5px; }
  .mrow { display: flex; justify-content: space-between; padding: 7px 0;
          border-bottom: 1px solid var(--line-soft); font-size: 13px; }
  .mrow:last-child { border-bottom: 0; }
  .mrow .faint { color: var(--faint); }
</style>
</head>
<body>
<div class="page">
  <div class="page-head">
    <h1>Edge metrics</h1>
    <div class="sub" id="ts">connecting…</div>
  </div>

  <div class="metrics">
    <div class="card"><h2>GPU</h2><div class="big" id="gpu">—</div><div id="gpuTemp" class="mrow"></div></div>
    <div class="card"><h2>CPU</h2><div class="big" id="cpu">—</div><div id="cpuTemp" class="mrow"></div></div>
    <div class="card"><h2>RAM</h2><div class="big" id="ram">—</div></div>
    <div class="card"><h2>Pipelines</h2><div id="pipes"></div></div>
    <div class="card" style="grid-column:1/-1"><h2>Cameras</h2><div id="cams"></div></div>
  </div>
</div>

<script src="ceravis.js"></script>
<script>
  renderNav("dashboard.html");
  const cls = (v, warn, bad) => v >= bad ? 'bad' : v >= warn ? 'warn' : 'ok';

  async function refresh() {
    try {
      const r = await fetch('/api/v1/metrics');
      const d = await r.json();
      document.getElementById('ts').textContent = new Date().toLocaleString();

      const sys = d.system || {};
      const gpu = sys.gpu_pct ?? '—';
      document.getElementById('gpu').innerHTML =
        `<span class="${cls(gpu,70,90)}">${gpu}%</span>`;
      document.getElementById('gpuTemp').innerHTML =
        `<span class="faint">GPU temp</span><span>${sys.gpu_temp_c ?? '—'} °C</span>`;

      const cpu = sys.cpu_pct_avg ?? '—';
      document.getElementById('cpu').innerHTML =
        `<span class="${cls(cpu,70,90)}">${cpu}%</span>`;
      document.getElementById('cpuTemp').innerHTML =
        `<span class="faint">CPU temp</span><span>${sys.cpu_temp_c ?? '—'} °C</span>`;

      const ramPct = sys.ram_pct ?? 0;
      document.getElementById('ram').innerHTML =
        `<span class="${cls(ramPct,75,90)}">${ramPct}%</span>
         <div class="mrow"><span class="faint">${sys.ram_used_mb||0} / ${sys.ram_total_mb||0} MB</span></div>`;

      // pipelines
      const pipes = d.pipelines || [];
      document.getElementById('pipes').innerHTML = pipes.length === 0
        ? '<div class="mrow"><span class="pill pill-mute">no data yet</span></div>'
        : pipes.map(p => `
            <div class="mrow">
              <span>${p.name}</span>
              <span class="faint">${p.fps} fps · ${p.latency_ms_avg} ms</span>
            </div>`).join('');

      // cameras
      const cams = d.cameras || {};
      document.getElementById('cams').innerHTML =
        Object.entries(cams).map(([cid, s]) => `
          <div class="mrow">
            <span>${cid} ${healthPill(s.health_state)}</span>
            <span class="faint">${(s.current_fps||0).toFixed(1)} fps ·
                  ${s.frames_captured} frames ·
                  ${s.reconnect_count} reconnects</span>
          </div>`).join('');
    } catch (e) {
      document.getElementById('ts').textContent = 'error: ' + e.message;
    }
  }
  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
