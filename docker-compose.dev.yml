# CERAVIS — Development Stack
# Local development environment

# Run with:
# docker compose -f docker-compose.dev.yml up --build

services:

  edge:
    build: ./edge
    container_name: ceravis-edge

    ports:
      - "8000:8000"

    env_file:
      - ./infra/env/edge.env

    volumes:
      - ./edge:/app
      - ./models:/models

    depends_on:
      - redis
      - nats

    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ceravis-redis

    volumes:
      - redis_data:/data

    restart: unless-stopped

  nats:
    image: nats:2-alpine
    container_name: ceravis-nats

    restart: unless-stopped

volumes:
  redis_data: